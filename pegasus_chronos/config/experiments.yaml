# PEGASUS-CHRONOS Experiment Parameters

experiments:
  # ─── Part I: Empirical (Groq / NIM API models) ───
  part1:
    models: ["llama-3.3-70b-versatile"]
    trials_per_condition: 3
    tasks: 2

    ecbs:
      name: "Evaluation-Context Behavioral Shift"
      abbreviation: "ECBS"
      task_types: 2
      trials_per_condition: 3
      conditions: ["deployment", "evaluation"]
      models: ["llama-3.3-70b-versatile"]
      max_turns_per_trial: 3

    dgss:
      name: "Deliberate Ghost State Score"
      abbreviation: "DGSS"
      agent_a_turns: 4
      trials_per_condition: 3
      conditions: ["deployment", "evaluation"]
      models: ["llama-3.3-70b-versatile"]
      human_validation_samples: 50
      human_raters: 3
      memory_top_k: 5

    cbpr:
      name: "Cross-Boundary Persistence Rate"
      abbreviation: "CBPR"
      max_hops: 6
      trials: 30
      memory_architectures:
        - "chromadb_cosine"
        - "key_value"
        - "episodic_summary"
      models: "all_nim"

  # ─── Part II: Mathematical Defenses (Local Llama-3-8B) ───
  part2:
    topology:
      name: "Topological Sanitization"
      abbreviation: "TOPO"
      benign_samples: 500
      ghost_samples: 50
      knn_k: 15
      model: "local_llama_8b"

    attention:
      name: "Attention Position Masking"
      abbreviation: "ATTN"
      model: "local_llama_8b"
      measure_utility_impact: true

    vib:
      name: "VIB Capacity Restriction"
      abbreviation: "VIB"
      beta_sweep: [0.0, 0.1, 0.5, 1.0, 2.0, 5.0, 10.0]
      model: "local_llama_8b"
      latent_dim_ratio: 0.5

    integrated:
      name: "Integrated CHRONOS Defense"
      abbreviation: "INT"
      defenses: ["topology", "attention", "vib"]
      model: "local_llama_8b"

# ─── Statistical Testing Parameters ───
statistical:
  significance_level: 0.05
  bonferroni_comparisons: 7
  corrected_alpha: 0.007142857  # 0.05 / 7
  confidence_level: 0.95
  effect_size_thresholds:
    small: 0.2
    medium: 0.5
    large: 0.8
  min_trials_per_condition: 30

# ─── Output Configuration ───
output:
  results_dir: "results"
  figures_dir: "results/figures"
  tables_dir: "results/tables"
  raw_trials_dir: "results/part1_raw_trials"
  defense_results_dir: "results/part2_defense_results"
  figure_dpi: 300
  figure_format: "png"
  latex_table_format: "neurips"

# ─── ARGUS-Style API Resilience Configuration ───
api_resilience:
  max_retries: 5
  backoff_factor: 2
  fallback_file: "results/raw_trials/fallback_baseline.json"
  context_window_limit: 8000  # Groq free tier TPM limit
  log_fallback_warnings: true
  transparency:
    flag_fallback_trials: true
    print_warnings: true
    append_metadata: true
